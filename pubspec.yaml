name: hijizli
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  provider: ^6.1.1
  flutter_screenutil: ^5.9.3
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  package_info_plus: ^8.1.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.6.0  # ✅ إضافة Firebase Firestore لنظام حجز المقاعد
  http: ^1.2.2
  country_code_picker: ^3.0.0
  currency_sdk: ^1.0.1  # ✅ لإدارة العملات والأسعار الحية

  # تسجيل الدخول عبر التواصل الاجتماعي
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.0
  sign_in_with_apple: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - images/

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Regular.ttf
        - asset: fonts/Cairo-Bold.ttf
          weight: 700